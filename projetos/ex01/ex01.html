<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de cadastro de usuários usando HTML, Bootstrap e JavaScript">
    <title>Cadastro de Usuários - TechStart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Cadastro de Usuários - TechStart</h2>
        
        <!-- Formulário de Cadastro -->
        <form id="userForm" class="border p-4 bg-white rounded">
            <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Idade</label>
                <input type="number" id="age" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
                <label for="gender" class="form-label">Gênero</label>
                <select id="gender" class="form-select">
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        
        <!-- Tabela de Usuários Cadastrados -->
        <h3 class="text-center mt-5">Usuários Cadastrados</h3>
        <table id="userTable" class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Idade</th>
                    <th>Gênero</th>
                </tr>
            </thead>
            <tbody>
                <!-- Usuários cadastrados serão exibidos aqui -->
            </tbody>
        </table>
    </div>

    <script src="ex01.js"></script>
</body>
</html>
